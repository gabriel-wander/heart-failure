name: CI

# Estratégia de CI resiliente e econômica:
# - core-tests: testes do pacote ICFlowCore no LINUX (Foundation puro,
#   multiplataforma) — minutos baratos (1×), roda em todo push.
# - ios-build: compila o app para o Simulador iOS no macOS (10× minutos) —
#   apenas SOB DEMANDA (workflow_dispatch), para economizar minutos. O app
#   também é compilado localmente no Xcode.

on:
  push:
    branches: [ "main", "feature/**", "claude/**" ]
  workflow_dispatch:

jobs:
  core-tests:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Run core unit tests (SwiftPM)
        run: swift test --package-path ICFlowCore

  ios-build:
    name: iOS app build (macOS, on demand)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select latest Xcode (16+)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build app for iOS Simulator (no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ICFlow.xcodeproj \
            -scheme ICFlow \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
