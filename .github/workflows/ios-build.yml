name: iOS Build

# Verifica que o app compila num Mac real e que os testes clínicos passam.
# - core-tests: roda os testes do pacote ICFlowCore (SwiftPM).
# - app-build: compila o app ICFlow para o Simulador iOS (sem assinatura).

on:
  push:
    branches: [ "claude/hopeful-pasteur-uQeCv", "main", "feature/**" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode (16+)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Xcode version
        run: xcodebuild -version

      - name: Run core unit tests (SwiftPM)
        run: swift test --package-path ICFlowCore

      - name: Build app for iOS Simulator (no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ICFlow.xcodeproj \
            -scheme ICFlow \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
